name: "Upstream Sync and Zero-Spillover PR Automation"

on:
  schedule:
    # 每周一 UTC 04:00 自动巡检（北京时间 12:00）
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: '选择要同步的上游仓库 (apk-reverse / open-tgtylab / open-reverselab / all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - apk-reverse
          - open-tgtylab
          - open-reverselab

permissions:
  contents: read

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Seep-Reverse-Lab
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Boundary Unit Tests
        run: |
          python setup/test_sync_upstream.py

      - name: Process Upstream Targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          CHOSEN_TARGET="${INPUT_TARGET:-all}"
          TARGETS=("apk-reverse" "open-tgtylab" "open-reverselab")
          if [ "$CHOSEN_TARGET" != "all" ]; then
            TARGETS=("$CHOSEN_TARGET")
          fi

          for TARGET in "${TARGETS[@]}"; do
            echo "========================================================"
            echo "正在巡检上游: $TARGET"
            echo "========================================================"

            # 1. 检查是否有更新
            set +e
            python setup/sync-upstream.py --target "$TARGET" --check-only
            CHECK_EXIT=$?
            set -e

            if [ $CHECK_EXIT -eq 0 ]; then
              echo "[$TARGET] 上游版本记录无变化。"
              continue
            fi
            if [ $CHECK_EXIT -ne 2 ]; then
              echo "::error::[$TARGET] 无法确认上游版本，停止同步。"
              exit "$CHECK_EXIT"
            fi

            echo "[$TARGET] 检测到上游新提交，开始隔离拉取..."
            BRANCH_NAME="sync/upstream-${TARGET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

            # 切出独立隔离分支
            git checkout -b "$BRANCH_NAME"

            # 执行定点拉取
            python setup/sync-upstream.py --target "$TARGET"

            # 2. 严格校验文件改动范围（防外溢断言）
            echo "正在对 git 状态执行防外溢断言..."
            python - "$TARGET" <<'PY'
          import subprocess
          import sys
          prefix = f"Tool/upstream/{sys.argv[1]}/".encode()
          tracked = subprocess.check_output(["git", "diff", "--name-only", "-z", "HEAD"])
          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          for path in (tracked + untracked).split(b"\0"):
              if path and not (path.startswith(prefix) or path == b"setup/.upstream-shas.json"):
                  raise SystemExit(f"同步文件越界: {path!r}")
          PY

            # 4. 提交并推送
            git add -- "Tool/upstream/${TARGET}" setup/.upstream-shas.json
            if git diff --staged --quiet; then
              echo "无实际文件内容变动，跳过提交。"
              git checkout main
              git branch -D "$BRANCH_NAME"
              continue
            fi

            COMMIT_MSG="chore(upstream): sync ${TARGET} to latest upstream (sandboxed)"
            git commit -m "$COMMIT_MSG"
            git push origin "$BRANCH_NAME"

            # 5. 生成 PR 说明正文并创建独立 PR
            PR_BODY="$RUNNER_TEMP/upstream-${TARGET}-pr-body.md"
            python setup/sync-upstream.py --make-pr-body "$PR_BODY" --target "$TARGET"
            cat >> "$PR_BODY" <<'NOTE'

          ### 合入前门禁
          本 PR 由 `GITHUB_TOKEN` 创建，推送和 PR 事件通常不会自动触发 `gates`。
          请维护者在 Actions → gates → Run workflow 中选择本 PR 的分支，检查 Linux 与 Windows 的全部结果后再转为可审阅并合入。
          本流程只证明同步步骤、同步前的边界单测与文件范围检查；未运行完整工作台回归，不证明上游内容已完成适配。
          NOTE

            EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
            if [ -n "$EXISTING_PR" ]; then
              echo "已存在针对分支 $BRANCH_NAME 的 PR (#$EXISTING_PR)，更新正文..."
              gh pr edit "$EXISTING_PR" --body-file "$PR_BODY"
            else
              gh pr create \
                --title "$COMMIT_MSG" \
                --body-file "$PR_BODY" \
                --base main \
                --head "$BRANCH_NAME" \
                --draft
              echo "成功创建针对 $TARGET 的隔离同步 PR！"
            fi

            git checkout main
          done
